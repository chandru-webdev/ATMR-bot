[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atmr-bot"
version = "0.1.0"
description = "Automated Trend-Following Mean Reversion Bot for MT5"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/", "backtest/"]

[[tool.mypy.overrides]]
module = "MetaTrader5"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: needs a running MT5 demo terminal",
]
